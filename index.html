<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURS 3200 — Formative 2 Interactive Review</title>
<style>
  :root{
    --ink:#12242b;
    --paper:#f6f3ec;
    --card:#ffffff;
    --teal:#1f4e5f;
    --teal-deep:#123642;
    --clay:#b5623f;
    --gold:#c99a3d;
    --good:#2f6b4f;
    --good-bg:#e6f2ea;
    --bad:#a4402f;
    --bad-bg:#fbe9e5;
    --line:#dcd5c4;
    --muted:#6b6559;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
  .masthead{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:3px solid var(--teal-deep);
    padding-bottom:14px;margin-bottom:6px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .masthead .brand{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--teal-deep);}
  .masthead .meta{font-size:12px;color:var(--muted);}
  h1.title{
    font-family:'Iowan Old Style','Georgia',serif;
    font-weight:400;
    font-size:34px;
    margin:10px 0 4px;
    color:var(--teal-deep);
    letter-spacing:-.01em;
  }
  .subtitle{font-family:'Helvetica Neue',Arial,sans-serif;color:var(--muted);font-size:14px;margin-bottom:28px;}

  /* ---------- Menu screen ---------- */
  .chapters{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;}
  @media (max-width:600px){.chapters{grid-template-columns:1fr;}}
  .chapter-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:6px solid var(--teal);
    border-radius:2px;
    padding:20px 20px 18px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .chapter-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(18,54,66,.10);}
  .chapter-card .num{font-size:11px;letter-spacing:.12em;color:var(--clay);font-weight:700;text-transform:uppercase;}
  .chapter-card h3{font-family:'Iowan Old Style','Georgia',serif;font-weight:400;font-size:22px;margin:6px 0 8px;color:var(--teal-deep);}
  .chapter-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px;}
  .chapter-card .count{font-size:12px;color:var(--teal);font-weight:600;}
  .progress-pill{
    display:inline-block;margin-top:8px;font-size:11px;padding:3px 9px;border-radius:20px;
    background:var(--good-bg);color:var(--good);font-weight:600;
  }
  .progress-pill.zero{background:#efeae0;color:var(--muted);}

  .mix-btn{
    margin-top:22px;width:100%;text-align:left;
    background:var(--teal-deep);color:#f6f3ec;border:none;
    padding:18px 20px;border-radius:2px;cursor:pointer;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .mix-btn:hover{background:#0c262f;}
  .mix-btn .num{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
  .mix-btn h3{font-family:'Iowan Old Style','Georgia',serif;font-weight:400;font-size:20px;margin:6px 0 4px;}
  .mix-btn p{font-size:13px;opacity:.8;margin:0;}

  /* ---------- Quiz screen ---------- */
  .quiz-header{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--muted);
    margin-bottom:10px;
  }
  .quiz-header button.back{
    background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;
    font-family:'Helvetica Neue',Arial,sans-serif;padding:0;text-decoration:underline;
  }
  .bar-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px;}
  .bar-fill{height:100%;background:var(--teal);transition:width .25s ease;}

  .topic-tag{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--clay);font-weight:700;margin-bottom:10px;
  }
  .q-text{font-size:21px;line-height:1.45;margin-bottom:22px;color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:2px;
    padding:13px 16px;cursor:pointer;font-size:15.5px;line-height:1.4;
    font-family:'Helvetica Neue',Arial,sans-serif;
    transition:background .1s ease, border-color .1s ease;
  }
  .opt:hover{border-color:var(--teal);}
  .opt .letter{
    flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--teal);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);
  }
  .opt.selected{border-color:var(--teal);background:#eef4f5;}
  .opt.correct{border-color:var(--good);background:var(--good-bg);}
  .opt.correct .letter{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.incorrect{border-color:var(--bad);background:var(--bad-bg);}
  .opt.incorrect .letter{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.55;}

  .rationale{
    margin-top:18px;padding:15px 18px;border-radius:2px;
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.55;
    display:none;
  }
  .rationale.show{display:block;}
  .rationale.good-box{background:var(--good-bg);border-left:4px solid var(--good);color:#1c3b2c;}
  .rationale.bad-box{background:var(--bad-bg);border-left:4px solid var(--bad);color:#5c2419;}
  .rationale b{display:block;margin-bottom:4px;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-family:'Helvetica Neue',Arial,sans-serif;}
  .next-btn{
    background:var(--teal-deep);color:#f6f3ec;border:none;padding:11px 22px;border-radius:2px;
    font-size:14px;cursor:pointer;font-weight:600;
  }
  .next-btn:disabled{background:#c9c2b2;cursor:not-allowed;}
  .next-btn:hover:not(:disabled){background:#0c262f;}
  .score-live{font-size:13px;color:var(--muted);}

  /* ---------- Results screen ---------- */
  .score-hero{
    text-align:center;padding:30px 10px 10px;font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .score-num{font-family:'Iowan Old Style','Georgia',serif;font-size:64px;color:var(--teal-deep);line-height:1;}
  .score-label{font-size:13px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.1em;}
  .score-msg{font-size:15px;margin-top:14px;color:var(--ink);font-family:'Iowan Old Style','Georgia',serif;}

  .review-list{margin-top:30px;}
  .review-item{
    border-top:1px solid var(--line);padding:16px 0;font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .review-item .rtopic{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);font-weight:700;}
  .review-item .rq{font-size:15px;margin:6px 0 8px;color:var(--ink);font-family:'Iowan Old Style','Georgia',serif;}
  .review-item .rrow{font-size:13.5px;margin-bottom:3px;}
  .review-item .rrow.wrong{color:var(--bad);}
  .review-item .rrow.right{color:var(--good);}
  .review-item .rrat{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5;}

  .end-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;font-family:'Helvetica Neue',Arial,sans-serif;}
  .end-actions button{
    padding:11px 20px;border-radius:2px;font-size:13.5px;cursor:pointer;font-weight:600;border:1px solid var(--teal-deep);
  }
  .btn-primary{background:var(--teal-deep);color:#f6f3ec;}
  .btn-primary:hover{background:#0c262f;}
  .btn-secondary{background:none;color:var(--teal-deep);}
  .btn-secondary:hover{background:#eee9dc;}

  .hidden{display:none !important;}
  ::selection{background:#d8c9a3;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand">NURS 3200 · Fundamentals of Nursing</div>
    <div class="meta">Summer 2026 · Formative Assessment 2</div>
  </div>
  <h1 class="title">Interactive Review</h1>
  <div class="subtitle">Four chapters, drawn straight from your study guide. Answer, get instant feedback and rationale, then review anything you missed.</div>

  <!-- MENU SCREEN -->
  <div id="menu-screen">
    <div class="chapters" id="chapter-grid"></div>
    <button class="mix-btn" id="mix-all-btn">
      <div class="num">Full Mix</div>
      <h3>All Chapters, Shuffled</h3>
      <p id="mix-desc">Every question across all four chapters in random order — closest to exam conditions.</p>
    </button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <button class="back" id="back-btn">← Back to chapters</button>
      <span id="q-counter"></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>

    <div class="topic-tag" id="q-topic"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div class="rationale" id="q-rationale"></div>

    <div class="nav-row">
      <span class="score-live" id="score-live"></span>
      <button class="next-btn" id="next-btn" disabled>Answer to continue</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="hidden">
    <div class="score-hero">
      <div class="score-num" id="score-num">0/0</div>
      <div class="score-label">Correct</div>
      <div class="score-msg" id="score-msg"></div>
    </div>
    <div class="end-actions">
      <button class="btn-primary" id="retry-btn">Retry this set</button>
      <button class="btn-secondary" id="menu-btn">Back to chapters</button>
    </div>
    <div class="review-list" id="review-list"></div>
  </div>

</div>

<script>
/* ================= QUESTION DATA ================= */

const chMobility = {
  key:"mobility", title:"Mobility (Week 5)", num:"Chapter 01",
  desc:"Physiology of movement, immobility complications, fall prevention, safe patient handling, exercise.",
  questions:[
    {topic:"Joints", q:"A patient's knee allows only flexion and extension in one plane. Which synovial joint type is this?", options:["Ball-and-socket","Hinge","Pivot","Saddle"], correct:1, rationale:"The knee and elbow are hinge joints, which permit movement in a single plane (flexion/extension). Ball-and-socket joints (hip, shoulder) allow free multi-directional movement; pivot joints (neck) allow rotation; saddle joints (thumb) allow movement in two planes."},
    {topic:"Skeletal System", q:"Which bone in the human body is unique in that it does not articulate with any other bone?", options:["Patella","Sternum","Hyoid","Sacrum"], correct:2, rationale:"The hyoid bone in the neck is the only bone in the body not connected to another bone at a joint — every other bone articulates somewhere."},
    {topic:"Muscular System", q:"During elbow flexion, the biceps contracts while the triceps lengthens to control the movement. What is the triceps acting as in this movement?", options:["Prime mover","Synergist","Antagonist","Sesamoid stabilizer"], correct:2, rationale:"The antagonist contracts in the opposite direction of the prime mover to control and reverse a movement. Here the biceps is the prime mover; the triceps is the antagonist."},
    {topic:"Body Movement Terms", q:"A nurse asks a patient to point their toes toward the shin as part of a neurovascular check. Which movement is being assessed?", options:["Plantar flexion","Dorsiflexion","Supination","Inversion"], correct:1, rationale:"Dorsiflexion is movement of the foot toward the shin at the ankle; plantar flexion is the opposite (toes pointing away, like pressing a gas pedal)."},
    {topic:"Nervous System", q:"Which part of the nervous system is primarily responsible for purposeful, voluntary movement and environmental recognition?", options:["Sympathetic nervous system", "Somatic nervous system", "Autonomic nervous system", "Enteric nervous system"], correct:1, rationale:"The somatic nervous system, part of the peripheral nervous system, controls purposeful movement and voluntary action through sensory and motor neuron interplay."},
    {topic:"Balance & Coordination", q:"A patient has difficulty judging how far to reach for a cup, consistently overshooting the target. This finding is best described as:", options:["Ataxia","Ptosis","Dysmetria","Dysarthria"], correct:2, rationale:"Dysmetria is the inability to judge distance or range of motion during a movement. Ataxia is a general loss of coordination; dysarthria is slurred speech."},
    {topic:"Posture", q:"Which statement about faulty posture is accurate?", options:["It has no effect on fall risk", "It only affects appearance, not joint health","It can erode vertebrae over time and increase fall risk","It is always caused by a neurologic disorder"], correct:2, rationale:"Slouching/slumping moves the spine out of alignment, decreases flexibility, erodes vertebrae (contributing to spinal degeneration and arthritis), and increases fall risk."},
    {topic:"Risks of Inactivity", q:"According to the lecture's cited data, physical inactivity is linked to roughly what increase in stroke risk?", options:["15%","30%","60%","90%"], correct:2, rationale:"The lecture cites approximately a 60% increase in stroke risk associated with physical inactivity, alongside a 45% increase in coronary artery disease risk and a 30% increase in hypertension risk."},
    {topic:"Fall Prevention", q:"What is the primary purpose of the BMAT 2.0 (Bedside Mobility Assessment Tool)?", options:["To calculate a patient's daily caloric needs","To rapidly assess a patient's mobility level and how safe it is for them to be active", "To determine a patient's discharge disposition","To score a patient's pain intensity"], correct:1, rationale:"BMAT 2.0 is a nurse-driven, bedside tool used to rapidly assess a patient's mobility level and gauge how safe it is for them to be active before any mobility attempt."},
    {topic:"Six-System Effects", q:"A patient has been on bedrest for 5 days. Which musculoskeletal change should the nurse expect to already be present?", options:["Full muscle recovery", "Measurable muscle atrophy and early contracture risk","Increased bone density","Improved joint flexibility"], correct:1, rationale:"Muscle atrophy begins at a rate of roughly 3–5% per day on bedrest, and contractures can develop within 3–7 days — both are expected by day 5."},
    {topic:"Six-System Effects", q:"Which finding would the nurse expect on Day 1 of strict bedrest, before any other systemic changes appear?", options:["Disuse osteoporosis","Orthostatic hypotension","Atelectasis","Urinary calculi"], correct:1, rationale:"Orthostatic hypotension begins as early as Day 1 of bedrest. Atelectasis can begin within 24 hours; disuse osteoporosis and urinary stones take longer (1–2+ weeks) to develop."},
    {topic:"VTE Prevention", q:"Virchow's Triad describes three factors that increase VTE risk. Which set correctly identifies them?", options:["Hypertension, hyperlipidemia, hyperglycemia","Venous stasis, endothelial injury, hypercoagulability","Fever, tachycardia, leukocytosis","Immobility, obesity, smoking"], correct:1, rationale:"Virchow's Triad is venous stasis (from bedrest eliminating the calf muscle pump), endothelial injury, and hypercoagulability. A patient with all three is at high VTE risk."},
    {topic:"VTE Prevention", q:"A nurse is caring for a high-risk post-surgical patient with SCDs applied correctly and running continuously. What is most important to add to adequately prevent VTE?", options:["Nothing further is needed","Pharmacologic prophylaxis such as low-molecular-weight heparin, per order","Daily Homan's sign checks as the primary screening method","Strict bedrest to avoid dislodging a clot"], correct:1, rationale:"SCDs alone are not sufficient prophylaxis for high-risk patients — both mechanical (SCDs) and pharmacologic (e.g., enoxaparin) prophylaxis are typically required. Homan's sign has poor sensitivity (<50%) and should never be relied on alone."},
    {topic:"Safe Patient Handling", q:"Per OSHA guidance referenced in lecture, what is the maximum weight a single nurse should manually lift without mechanical assistance?", options:["15 lbs","35 lbs","50 lbs","75 lbs"], correct:1, rationale:"OSHA guidance states no single nurse should manually lift more than 35 lbs without mechanical assistance."},
    {topic:"Safe Patient Handling", q:"Before any patient-handling activity, which of the following is one of the six required preparation steps?", options:["Obtain a full medication reconciliation","Confirm every team member understands their role","Notify the patient's insurance provider","Schedule a follow-up outpatient visit"], correct:1, rationale:"The six preparation steps include assessing the patient's needs, ensuring enough staff, preparing the environment, confirming each team member's role, explaining the plan to the patient, and applying proper body mechanics."},
    {topic:"Patient Positioning", q:"Which position carries the highest risk of pressure injury at the sacrum and heels?", options:["Semi-Fowler's","Supine (dorsal)","Lateral","Fowler's"], correct:1, rationale:"Supine positioning carries the highest pressure-injury risk at the sacrum and heels, along with increased aspiration risk if the patient is sedated."},
    {topic:"Patient Positioning", q:"Which position is the evidence-based default for post-operative patients to simultaneously reduce atelectasis, aspiration, and pressure injury risk?", options:["Supine","Semi-Fowler's (30–45°)","Prone","Trendelenburg"], correct:1, rationale:"Semi-Fowler's (30–45°) is the evidence-based default position for post-operative patients, reducing atelectasis, aspiration, and pressure injury risk simultaneously."},
    {topic:"Weight-Bearing Status", q:"A patient's order reads \"WBAT.\" What does this mean for the nurse's mobility plan?", options:["The patient may bear no weight on the affected limb at all","The patient self-determines comfort while the nurse monitors for pain, instability, or gait changes","The patient must bear 50% body weight exactly, as measured by a scale","The patient is cleared for unrestricted activity with no gait aid"], correct:1, rationale:"WBAT (Weight-Bearing As Tolerated) means the patient self-determines comfort level while the nurse monitors for pain, instability, and gait changes. Weight-bearing status always comes from a provider/PT order, never a nursing judgment call."},
    {topic:"Gait Aids", q:"Two days after a laparotomy, a patient is WBAT and needs maximum stability while keeping the abdominal wound protected. Which gait aid is most appropriate?", options:["Single-point cane","Quad cane","Standard walker","Wheeled rollator"], correct:2, rationale:"A standard walker provides maximum stability and is appropriate from NWB to WBAT status, including early post-op abdominal surgery — the patient should keep abdominal muscles braced when lifting it to reduce wound tension."},
    {topic:"Exercise Types", q:"A physical therapist has a patient perform single-leg stands and use a wobble board. Which type of exercise is this?", options:["Aerobic","Strength (isometric)","Balance training","Stretching/flexibility"], correct:2, rationale:"Balance training (single-leg stands, wobble boards, yoga) improves the ability to remain upright while stationary or moving and reduces fall risk."},
    {topic:"Exercise Types", q:"Which best describes isometric strength training?", options:["Muscle contraction against a moving force", "Muscle contraction against an unmoving force","Continuous activity that raises heart rate","Slow, steady movement that lengthens muscles"], correct:1, rationale:"Isometric strength training involves contracting a muscle against an unmoving force (as opposed to isotonic, which is against a moving force)."},
    {topic:"Psychological Barriers", q:"A patient avoids exercising in public out of embarrassment about their fitness level. Which strategy best addresses this barrier?", options:["Suggest an independent home exercise program or a beginner-level class", "Recommend high-intensity group classes to build confidence quickly","Tell the patient embarrassment is not a valid reason to avoid exercise","Refer immediately to a physical therapist for supervised sessions only"], correct:0, rationale:"For embarrassment as a barrier, the recommended strategy is independent home exercise or beginner-level classes so everyone starts equal."},
    {topic:"Lifestyle Factors", q:"A patient reports \"not much\" exercise but works a physically demanding warehouse job lifting boxes five days a week. What does this scenario illustrate?", options:["The patient is being dishonest about their activity level","A thorough activity assessment must look beyond leisure activity to work, home, and transportation activity","Warehouse work does not count as physical activity","The patient should be referred for psychiatric evaluation"], correct:1, rationale:"A thorough activity assessment includes work, home, transportation, and leisure activity — not just gym or sport. Missing this misses a major piece of a patient's real activity level."},
    {topic:"Fall Prevention", q:"Which of the following is one of the seven items scored by the Morse Fall Scale?", options:["Blood pressure trend","Ambulatory aid in use","Insurance status","Room number"], correct:1, rationale:"The Morse Fall Scale scores six items: history of falling, secondary diagnosis, ambulatory aid, IV/heparin lock, gait/transferring, and mental status."},
    {topic:"Safe Transfer", q:"During a bed-to-stretcher transfer, the receiving surface should be positioned:", options:["Level with the bed, exactly even","About ½ inch higher than the bed","About ½ inch lower than the bed","It does not matter as long as both are locked"], correct:2, rationale:"During bed-to-stretcher transfer, the receiving surface should be locked about ½ inch lower than the originating surface before the transfer occurs."}
  ]
};

const chWeek6 = {
  key:"week6", title:"Week 6", num:"Chapter 02",
  desc:"Fluid, electrolyte & acid-base balance, oxygenation, and urinary elimination.",
  questions:[
    {topic:"Fluid Compartments", q:"Approximately what percentage of total body water is intracellular fluid (ICF)?", options:["33%","50%","67%","90%"], correct:2, rationale:"ICF makes up approximately 67% of total body water, where most metabolic chemical reactions occur; ECF makes up the remaining ~33%."},
    {topic:"Fluid Movement", q:"Which process is described as the passive movement of water across a semipermeable membrane from an area of lower solute concentration to higher solute concentration?", options:["Diffusion","Filtration","Osmosis","Active transport"], correct:2, rationale:"Osmosis is the passive movement of water (not solutes) across a semipermeable membrane toward higher solute concentration, until both sides equalize."},
    {topic:"Fluid Movement", q:"The sodium-potassium pump, which keeps sodium high outside the cell and potassium high inside, is an example of:", options:["Osmosis","Diffusion","Filtration","Active transport"], correct:3, rationale:"Active transport moves solutes against a concentration gradient using ATP energy through a transmembrane protein — the sodium-potassium pump is the classic example."},
    {topic:"Intake & Output", q:"Which of the following correctly counts toward a patient's fluid intake?", options:["Only IV fluids","Only oral liquids at room temperature, not ice chips","Ice chips, counted as about half their volume in water","Ice chips at their full measured volume"], correct:2, rationale:"Anything liquid at room temperature counts as intake, including ice chips — which are counted as about half their volume in water."},
    {topic:"FVD Assessment", q:"A patient with 3 days of vomiting and diarrhea has dry oral mucosa, flat neck veins, HR 118, and BP 96/58. This presentation is most consistent with:", options:["Fluid volume excess","Fluid volume deficit","Third-spacing without hypovolemia","Normal euvolemic status"], correct:1, rationale:"Dry mucosa, flat neck veins, tachycardia, and hypotension after GI fluid losses are classic fluid volume deficit (hypovolemia) findings."},
    {topic:"FVE Assessment", q:"A heart failure patient presents with bilateral +2 pitting edema, crackles at the lung bases, distended neck veins, and a 3 kg weight gain in 2 days. This is most consistent with:", options:["Fluid volume deficit","Third-spacing","Fluid volume excess","Normal post-meal weight fluctuation"], correct:2, rationale:"Peripheral edema, crackles, distended neck veins, and rapid weight gain are classic fluid volume excess (hypervolemia) findings."},
    {topic:"Third-Spacing", q:"A post-abdominal-surgery patient has rising abdominal girth, falling BP, and rising HR, but a normal or increasing total body weight. What does this suggest?", options:["Straightforward fluid volume excess","Third-spacing — fluid trapped in a space that doesn't normally hold it, unavailable to the intravascular space","A lab error requiring no clinical action","Normal recovery from anesthesia"], correct:1, rationale:"Third-spacing is fluid shifting into a space that doesn't normally hold it (e.g., the peritoneal cavity as ascites) — it's physiologically \"trapped,\" so the patient can show hypovolemic signs despite normal or rising weight."},
    {topic:"Daily Weights", q:"A patient on a cardiac unit gains 2 lbs (~1 kg) overnight. How should the nurse interpret this?", options:["Insignificant, likely measurement error", "Approximately 1 liter of fluid gained — warrants follow-up, especially in heart failure","Evidence of muscle gain from physical therapy","Normal, since weight always fluctuates by a few pounds daily"], correct:1, rationale:"1 kg of acute weight change equals about 1 liter of fluid gained or lost. A 2-lb overnight gain in a heart failure patient is a red flag, not a rounding error."},
    {topic:"Electrolytes", q:"A patient's ECG shows peaked T waves, and they report muscle weakness and \"heart flutters.\" Which electrolyte imbalance is most likely?", options:["Hypocalcemia","Hyperkalemia","Hyponatremia","Hypomagnesemia"], correct:1, rationale:"Peaked T waves, muscle weakness, and cardiac symptoms are classic signs of hyperkalemia, which carries a risk of fatal dysrhythmias and requires cardiac monitoring."},
    {topic:"Electrolytes", q:"A patient with severe hyponatremia (Na⁺ 122 mEq/L) is confused and lethargic with a headache. What is the priority nursing intervention?", options:["Encourage the patient to drink more free water","Initiate seizure precautions","Restrict all IV fluids immediately without provider input","Apply hypothermia blankets"], correct:1, rationale:"Severe hyponatremia can cause cerebral edema and seizures — seizure precautions (bed in lowest position, padded rails) are the priority, and correction must not happen too quickly."},
    {topic:"BMP", q:"Which set of values is included in a Basic Metabolic Panel (BMP)?", options:["Hemoglobin, hematocrit, platelets","Sodium, potassium, chloride, CO2, BUN, creatinine, glucose, calcium","Total cholesterol, LDL, HDL, triglycerides","INR, PT, PTT"], correct:1, rationale:"The BMP includes core electrolytes (Na, K, Cl, CO2), kidney function markers (BUN, creatinine), glucose, and total calcium — giving a fast snapshot of fluid, electrolyte, and renal status."},
    {topic:"Acid-Base Regulation", q:"Which system responds to an acid-base imbalance the fastest?", options:["The kidneys","The lungs","Chemical (bicarbonate) buffers","The liver"], correct:2, rationale:"Chemical buffers (the bicarbonate system) act within seconds as the first line of defense. Lungs act within minutes; kidneys act over hours to days but have the most powerful, lasting effect."},
    {topic:"Anion Gap", q:"A patient's anion gap is calculated at 18 mmol/L. What does this indicate?", options:["A normal anion gap, no further workup needed","A nonanion gap metabolic acidosis, most likely from diarrhea","An elevated anion gap, suggesting an acid such as lactate, ketones, or a toxin has been added to the system","A primary respiratory disturbance"], correct:2, rationale:"A normal anion gap is 4–12 mmol/L. A gap greater than 12 signals extra unmeasured anions — an acid has been added, as in DKA, lactic acidosis, or toxic ingestions (CAT MUDPILES)."},
    {topic:"ABG Interpretation", q:"An ABG shows pH 7.30, PaCO2 58 mm Hg, HCO3⁻ 24 mEq/L. This pattern is most consistent with:", options:["Metabolic acidosis","Respiratory acidosis","Metabolic alkalosis","Respiratory alkalosis"], correct:1, rationale:"A low pH with an elevated PaCO2 (the respiratory component) reflects respiratory acidosis — consistent with a COPD exacerbation retaining CO2."},
    {topic:"IV Fluids", q:"A patient with DKA has just received an initial isotonic fluid bolus. Which fluid type is often used next for cellular rehydration?", options:["3% NS (hypertonic)","0.45% NS (hypotonic)","D5NS (hypertonic)","0.9% NS repeated indefinitely"], correct:1, rationale:"Hypotonic fluids (0.45% NS) have lower osmolality than plasma and move water into cells — used for cellular dehydration and DKA after an initial isotonic bolus. Avoid in increased ICP."},
    {topic:"Oxygenation Steps", q:"A patient has normal ventilation and diffusion but poor cardiac output delivering oxygenated blood to tissues. Which step of oxygenation is impaired?", options:["Ventilation","Perfusion","Diffusion","Regulation"], correct:1, rationale:"Perfusion is the cardiovascular system's ability to pump oxygenated blood to tissues. A problem in any one of ventilation, perfusion, or diffusion can cause hypoxia even if the others are normal."},
    {topic:"Respiratory Regulation", q:"Why should high-flow oxygen be used cautiously in a patient with long-standing COPD?", options:["It has no special risk in this population","Chronic CO2 retainers may rely more on low oxygen levels to drive their respiratory effort","It causes immediate bronchospasm in all COPD patients","It permanently damages the alveoli within minutes"], correct:1, rationale:"In chronic CO2 retainers, the drive to breathe can shift to rely more on low oxygen levels rather than rising CO2 — a reason to use caution with high-flow oxygen in this population."},
    {topic:"Hypoxia Recognition", q:"Which of the following is a LATE sign of hypoxia, not an early one?", options:["Restlessness","Rising heart rate","Cyanosis","Agitation"], correct:2, rationale:"Cyanosis is a late sign of hypoxia. Early signs are subtle: restlessness, agitation, and a rising heart rate — waiting for cyanosis means significant deterioration has already occurred."},
    {topic:"Pulse Oximetry", q:"Which factor can cause a falsely normal SpO2 reading despite inadequate oxygen content in the blood?", options:["Nail polish","Low hemoglobin (severe anemia)","Patient movement","Cold extremities"], correct:1, rationale:"Low hemoglobin states can cause SpO2 to appear falsely normal, because pulse oximetry measures the percentage of available hemoglobin that is saturated — not the total oxygen content of the blood."},
    {topic:"Atelectasis", q:"Which intervention is the single most effective at preventing post-operative atelectasis?", options:["Strict bedrest","Early ambulation","Fluid restriction","Withholding pain medication to avoid sedation"], correct:1, rationale:"Early ambulation is the single most effective intervention for atelectasis prevention, alongside turn-cough-deep-breathe (TCDB) and incentive spirometry."},
    {topic:"Oxygen Delivery", q:"Which oxygen delivery device delivers the highest possible FiO2, up to 100%?", options:["Nasal cannula","Simple face mask","High-flow nasal cannula","Venturi mask at 24%"], correct:2, rationale:"High-flow nasal cannula can deliver up to 60 L/min flow and up to 100% FiO2 — the highest of the devices listed. Standard nasal cannula delivers 24–44%; simple mask delivers 28–50%."},
    {topic:"Urinary Elimination", q:"Which finding falls within the normal range for urine specific gravity?", options:["0.990","1.015","1.045","1.060"], correct:1, rationale:"Normal urine specific gravity is 1.003–1.032. A value like 1.015 falls within normal range; values outside this range suggest dehydration, overhydration, or renal/hormonal disorders."},
    {topic:"Catheterization", q:"Which type of catheter is used for a single, one-time bladder drainage or specimen collection with no balloon?", options:["Indwelling (Foley) catheter","Coudé catheter","Straight (in-and-out) catheter","Condom catheter"], correct:2, rationale:"A straight (in-and-out) catheter is single-use with no retention balloon, used for one-time drainage or a sterile specimen."},
    {topic:"CAUTI Prevention", q:"Which action is part of the evidence-based CAUTI prevention bundle?", options:["Keep the drainage bag above the level of the bladder for easier viewing","Change the entire closed drainage system daily as routine practice","Keep the collection bag below the level of the bladder at all times","Disconnect the tubing briefly each shift to inspect the connection"], correct:2, rationale:"Keeping the collection bag below bladder level prevents backflow and is part of the CAUTI prevention bundle, along with maintaining a closed sterile system and assessing necessity every shift."},
    {topic:"Catheter Complications", q:"A nurse finds 900 mL of urine in a patient's bladder on bladder scan after a period of retention. What is the safest approach to draining it via straight catheterization?", options:["Drain all 900 mL as quickly as possible","Clamp and drain in stages per protocol to avoid bladder decompression injury","Refuse to drain more than 200 mL under any circumstances","Delay draining until the following shift"], correct:1, rationale:"Draining more than 700 mL rapidly can cause hypotension or bladder wall trauma (bladder decompression injury) — clamp and drain in stages per protocol when a large residual is found."}
  ]
};

    {topic:"Never Events", q:"Which of the following is classified as a nursing-influenced CMS \"never event\"?", options:["A patient's mild rash from a new lotion","A Stage III or IV pressure ulcer that develops during a hospital stay","A patient who declines a recommended screening test","A one-time missed non-urgent physical therapy session"], correct:1, rationale:"Common nursing-influenced never events include patient falls with injury/death, severe (Stage III/IV) pressure ulcers, and medication errors causing serious injury or death."},
    {topic:"Just Culture", q:"A nurse overrides a barcode-scanner warning because the delay seemed unnecessary in the moment, and a wrong-dose error results. How does Just Culture classify this behavior?", options:["Reckless behavior, warranting immediate termination","At-risk behavior, warranting coaching","Human error, requiring no action","Criminal behavior, requiring police involvement"], correct:1, rationale:"At-risk behavior is a risky choice made because the risk wasn't recognized or seemed justified at the time — like overriding a barcode warning. Just Culture responds with coaching, not punishment, distinguishing it from reckless behavior (conscious disregard of risk)."},
    {topic:"Never Events & RCA", q:"After a serious medication error, the hospital convenes a multidisciplinary team to review system factors like look-alike drug labels rather than focusing on the individual nurse. This process is called:", options:["A near miss","Root cause analysis","A Never Event report only","Peer review discipline"], correct:1, rationale:"Root cause analysis is a structured, multidisciplinary review of a serious event that looks at system factors rather than blaming the individual nurse."},
    {topic:"Sleep Physiology", q:"Which structure functions as the body's \"master clock,\" regulating the 24-hour sleep-wake cycle?", options:["The hypothalamus's sleep-promoting neurons alone","The suprachiasmatic nucleus (SCN)","The reticular activating system (ARAS)","The pineal body wall"], correct:1, rationale:"The suprachiasmatic nucleus (SCN) is the master clock that regulates the 24-hour sleep-wake cycle and synchronizes individual cell clocks; light is the strongest time cue it detects."},
    {topic:"Sleep Architecture", q:"During which stage of sleep does the body do the most tissue restoration and physical repair?", options:["NREM Stage I","NREM Stage III (deep/slow-wave)","REM sleep","The transition between stages"], correct:1, rationale:"NREM Stage III (slow-wave sleep) is the most restorative stage, associated with tissue repair, immune function, and physical restoration — and is the hardest stage from which to arouse a sleeper."},
    {topic:"Sleep Architecture", q:"Vivid, story-like dreaming and memory consolidation are primarily associated with which sleep stage?", options:["NREM Stage I","NREM Stage II","NREM Stage III","REM sleep"], correct:3, rationale:"REM sleep supports dreaming, memory consolidation, and mood regulation."},
    {topic:"Insomnia", q:"A patient reports trouble falling and staying asleep at least 4 nights a week for the past 5 months. How should this be classified?", options:["Short-term insomnia","Chronic insomnia","Normal age-related sleep change","Parasomnia"], correct:1, rationale:"Chronic insomnia is the same pattern (trouble falling/staying asleep) persisting 3 or more months — this patient's 5-month history meets that definition. Short-term insomnia is under 3 months."},
    {topic:"Insomnia Management", q:"What is the recommended first-line treatment for chronic insomnia?", options:["Benzodiazepine hypnotics", "Cognitive-behavioral therapy for insomnia (CBT-I)","Over-the-counter antihistamine sleep aids nightly","Increased daytime napping"], correct:1, rationale:"CBT-I is the recommended first-line treatment for chronic insomnia — not medication. Drug therapy is generally reserved for short-term use only."},
    {topic:"Obstructive Sleep Apnea", q:"What is the biggest challenge to CPAP effectiveness for a patient with obstructive sleep apnea?", options:["Cost of the device alone","Adherence — using it consistently (≥4 hrs/night, 5+ nights/week)","Lack of insurance coverage in all cases","CPAP has no established effectiveness for OSA"], correct:1, rationale:"CPAP is first-line treatment for OSA, but adherence (≥4 hrs/night, 5+ nights/week) is the biggest challenge to its effectiveness; mask fit is the single biggest driver of adherence."},
    {topic:"Sleep in the Hospital", q:"Which nursing action best supports sleep protection for a hospitalized patient?", options:["Perform all vital signs and medication administration at scheduled individual times through the night","Cluster care to group vitals, medications, and assessments and minimize interruptions","Keep hallway lights bright to ensure visibility for staff at all times","Avoid asking the patient what disrupted their sleep, to prevent complaints"], correct:1, rationale:"Clustering care groups vitals, medications, and assessments to minimize overnight interruptions — a core nonpharmacologic strategy for protecting hospital sleep, along with dimming lights and asking patients directly what disrupted their sleep."},
    {topic:"Pain Process", q:"Which sequence correctly describes the four steps of nociception?", options:["Perception → Transmission → Transduction → Modulation","Transduction → Transmission → Perception → Modulation","Modulation → Transduction → Perception → Transmission","Transmission → Modulation → Transduction → Perception"], correct:1, rationale:"Nociception proceeds through transduction (pain stimulus converted to a nerve signal), transmission (signal travels to the CNS), perception (conscious awareness), and modulation (the CNS alters pain signaling)."},
    {topic:"Types of Pain", q:"A patient describes burning, shooting pain following a nerve injury from surgery. This is best classified as:", options:["Somatic nociceptive pain","Visceral nociceptive pain","Neuropathic pain","Referred pain"], correct:2, rationale:"Neuropathic pain arises from damaged or malfunctioning nerves and is often described as burning, shooting, or tingling — distinct from nociceptive pain, which arises from tissue damage."},
    {topic:"Opioid Safety", q:"A patient on a scheduled opioid regimen for 3 months now requires a higher dose to achieve the same pain relief. This is best explained by:", options:["Addiction","Physical dependence","Tolerance","Pseudoaddiction"], correct:2, rationale:"Tolerance is needing a higher dose over time to maintain the same pain control — a normal pharmacologic response, not addiction. Physical dependence refers to withdrawal symptoms if the drug is stopped abruptly."},
    {topic:"Pain Goals", q:"What is the most appropriate pain-control goal for a patient recovering from abdominal surgery?", options:["A pain score of 0/10 at all times","Pain control sufficient to participate in recovery activities like turning, coughing, and ambulating","Complete elimination of all opioid use by post-op day 1","A pain score identical to what the nursing staff would tolerate"], correct:1, rationale:"For acute pain, the goal is pain control sufficient to participate in recovery activities (turning, coughing, ambulating) — not necessarily a 0/10, which is rarely achievable or necessary."},
    {topic:"Pain Assessment", q:"Which mnemonic below is used specifically to structure a pain history, prompting onset, provocation, quality, region/radiation, severity, and timing?", options:["SBAR","OPQRST","SPICES","SCALES"], correct:1, rationale:"OPQRST stands for Onset, Provocation/Palliation, Quality, Region/Radiation, Severity, Time — a structured checklist for a pain history."},
    {topic:"Nonverbal Pain Cues", q:"A sedated, nonverbal post-operative patient has a flat facial affect and stable vital signs. How should the nurse interpret this?", options:["The flat affect confirms the patient is comfortable and pain-free","A flat or blunted affect can mask significant pain and should not be assumed to indicate calm","Vital sign stability rules out pain entirely","No further pain assessment is needed until the patient can self-report"], correct:1, rationale:"A flat or blunted affect can be misread as calm but can actually mask significant pain — when in doubt, treat, since unrelieved pain in a nonverbal patient is a safety issue, not just a comfort issue."},
    {topic:"WHO Pain Ladder", q:"According to the WHO approach to pain treatment, which class of medication is first-line for mild-to-moderate pain?", options:["Opioids","Non-opioids (acetaminophen, NSAIDs)","Adjuvants such as gabapentin","Benzodiazepines"], correct:1, rationale:"The WHO pain ladder places non-opioids (acetaminophen and NSAIDs) as first-line treatment for mild-to-moderate pain, escalating to opioids as severity increases, with adjuvants used for neuropathic components."},
    {topic:"Multimodal Analgesia", q:"What is the main advantage of multimodal analgesia (e.g., acetaminophen + NSAID + opioid) over opioid-only pain management?", options:["It always eliminates the need for any opioid","It targets pain through different mechanisms and allows a lower opioid dose with fewer side effects","It works faster than any single-agent approach in all cases","It removes the need for pain reassessment"], correct:1, rationale:"Combining drug classes with different mechanisms improves relief while lowering the dose needed of any single drug — multimodal care generally outperforms any single approach with fewer side effects overall."},
    {topic:"GI Structure", q:"Which segment of the GI tract is primarily responsible for absorbing water and electrolytes and moving stool toward elimination?", options:["Duodenum","Jejunum","Ileum","Large intestine"], correct:3, rationale:"The large intestine absorbs water and electrolytes and stores/moves stool toward elimination via peristalsis, while the small intestine (duodenum, jejunum, ileum) is the primary site of nutrient digestion and absorption."},
    {topic:"Defecation Reflex", q:"What triggers the internal anal sphincter to relax during the defecation reflex?", options:["Voluntary contraction of the external sphincter","Stool entering the rectum and stretching its walls","A drop in serum sodium","Increased intra-abdominal pressure from coughing"], correct:1, rationale:"Stool entering the rectum triggers stretch receptors, causing the internal sphincter to relax reflexively. The external sphincter remains under voluntary control, allowing a person to delay defecation."},
    {topic:"Medications & Bowel Function", q:"Which class of medication most commonly causes constipation as an anticholinergic side effect?", options:["SSRIs","Tricyclic antidepressants","Proton pump inhibitors","Antibiotics"], correct:1, rationale:"Anticholinergic medications, including tricyclic antidepressants, slow intestinal transit and commonly cause constipation. SSRIs and PPIs can cause diarrhea in some patients instead."},
    {topic:"Opioid-Induced Constipation", q:"A patient has been on scheduled opioids for 4 days with no bowel movement. What is the most appropriate nursing action?", options:["Wait, since tolerance to this effect typically develops within a week","Escalate the bowel regimen (e.g., add a stimulant laxative) rather than continuing to observe","Discontinue the opioid immediately without provider consultation","Restrict oral fluids to reduce bowel workload"], correct:1, rationale:"Opioid-induced constipation does NOT resolve with tolerance. A gap of 3+ days without a bowel movement on opioids should prompt regimen escalation, not just observation — a bowel regimen should have started with the first dose."},
    {topic:"Bowel Diversions", q:"A nurse assesses a patient's colostomy stoma and finds it dusky and dark in color. What is the appropriate response?", options:["Document as an expected finding and reassess in 8 hours","Notify the provider immediately — this suggests compromised blood flow","Apply a warm compress to improve stoma color","Irrigate the stoma to flush out the discoloration"], correct:1, rationale:"A dusky or dark stoma is an urgent finding signaling compromised blood flow and needs immediate notification — it is never a routine or expected finding."}

    {topic:"Health Literacy", q:"Which approach best reflects CDC recommendations for supporting patients with limited health literacy?", options:["Write materials at a tenth-grade reading level for thoroughness","Use plain language and visuals, limit each visit to about three key points, and confirm with teach-back","Cover as many topics as possible in one visit","Use medical terminology consistently so patients learn it"], correct:1, rationale:"CDC strategies include plain language, visual aids, small concrete steps, writing at or below sixth-grade level, limiting visits to three key points, and confirming comprehension with teach-back."},
    {topic:"RN Responsibility", q:"Which of the following activities must the RN perform and cannot be delegated to assistive personnel?", options:["Obtaining routine vital signs","Assisting with morning hygiene","Teaching a patient how to manage a new medication","Ambulating a stable patient in the hallway"], correct:2, rationale:"Patient and caregiver teaching is an RN responsibility that cannot be delegated to assistive personnel — the RN owns assessment, planning, implementation, and evaluation of learning."},

    {topic:"Learning Domains", q:"A patient practices drawing up and self-injecting insulin until performing it correctly. This primarily reflects which domain of learning?", options:["Cognitive","Affective","Psychomotor","Metacognitive"], correct:2, rationale:"Psychomotor learning is the development of organized patterns of muscular activity — hands-on skills taught through demonstration and evaluated through return demonstration."},
    {topic:"Bloom's Taxonomy", q:"According to Bloom's Revised Taxonomy (2001), which level sits at the pinnacle, above \"Evaluate\"?", options:["Analyze","Apply","Create","Synthesize"], correct:2, rationale:"The 2001 revision replaced \"synthesis\" with \"create\" and moved it to the pinnacle: Remember → Understand → Apply → Analyze → Evaluate → Create."},
    {topic:"Assessing the Learner", q:"A patient rates their incisional pain 7/10 right before a scheduled teaching session on home dressing changes. What should the nurse do first?", options:["Proceed with teaching while the content is fresh","Give written instructions to read independently instead","Administer the prescribed analgesic and delay teaching until pain is controlled","Ask a family member to learn the skill in the patient's place"], correct:2, rationale:"Physical factors such as unmanaged pain directly block learning. The nurse should treat pain first to maximize the patient's readiness to learn."},
    {topic:"Health Literacy in Writing", q:"Which guideline best reflects recommended written patient education materials?", options:["Write at or below a fifth-grade level with short sentences and common words","Use passive voice for a professional tone","Keep sentences at 25–30 words to reduce paragraph count","Avoid pictures, which can distract from the text"], correct:0, rationale:"Written materials should be at or below a fifth-grade reading level: short sentences (10–15 words), common 1–2 syllable words, simply defined medical terms, pictures included, and active voice."},
    {topic:"Learning Goals", q:"Which learning goal is written correctly for a patient beginning insulin therapy?", options:["Patient will understand insulin therapy","Nurse will teach the patient about insulin administration","Patient will know why insulin is important","Patient will correctly demonstrate self-injection of insulin using an insulin pen before discharge"], correct:3, rationale:"Learning goals must be clear, measurable, and describe the patient's outcome. \"Demonstrate\" is observable and measurable; \"understand\" and \"know\" cannot be measured."},
    {topic:"ANA Standards", q:"ANA Standard 5B addresses which nursing responsibility?", options:["Delegation and supervision","Health teaching and health promotion","Medication administration safety","Quality improvement and research"], correct:1, rationale:"ANA Standard 5B, Health Teaching and Health Promotion, states the RN employs strategies to teach and promote health and wellness in collaboration with the patient's values, beliefs, and readiness to learn."},
    {topic:"Evaluating Learning", q:"After discharge teaching about heart failure self-management, which patient behavior gives the nurse the best evidence that learning occurred?", options:["The patient nods and smiles throughout the session","The patient signs the discharge education checklist","The patient explains in their own words when to call the provider about weight gain","The patient says, \"Yes, I understand everything\""], correct:2, rationale:"Teach-back — the patient explaining content in their own words — is the gold-standard evaluation method; nods, signatures, and verbal agreement do not demonstrate comprehension."},
    {topic:"Delegation", q:"Which of the following is NOT one of the five rights of delegation?", options:["Right task","Right documentation","Right circumstance","Right supervision"], correct:1, rationale:"The five rights of delegation are right task, right circumstance, right person, right communication, and right supervision. Documentation is essential practice but is not one of the five rights."},
    {topic:"Delegation Accountability", q:"An RN delegates ambulation of a stable patient to a UAP. Who retains accountability for the delegated task?", options:["The delegating RN","The UAP who performed the task","The charge nurse for the shift only","No one — accountability transfers with the task"], correct:0, rationale:"The delegating nurse always retains accountability for a delegated task, even though the UAP is responsible for performing it correctly."},
    {topic:"Professional Development", q:"A new nurse is coached and supervised in real time by a licensed professional during clinical rotations. This relationship is best described as:", options:["Mentorship","Preceptorship","Peer review","Case management"], correct:1, rationale:"Preceptorship involves a licensed professional coaching and supervising students or new nurses in the clinical setting with hands-on, real-time feedback — distinct from mentorship, which is a longer-term career relationship."},
    {topic:"Complementary & Integrative Health", q:"A patient receives acupuncture for chronic back pain while continuing her prescribed medications. According to NCCIH terminology, this is best described as:", options:["Alternative medicine","Complementary medicine","Conventional medicine","Homeopathic medicine"], correct:1, rationale:"A non-mainstream approach used together with conventional medicine is complementary. The same approach used in place of conventional medicine would be alternative."},
    {topic:"Holistic Therapies", q:"A patient recovering from orthopedic surgery asks for a leg massage to relax. Which assessment finding would make this contraindicated?", options:["Difficulty sleeping in the hospital","Pain rated 4/10","Suspected deep vein thrombosis (DVT) in the calf","Oral pain medication given one hour ago"], correct:2, rationale:"Massage should never be performed on the legs of a patient with known or suspected DVT, because it can dislodge the clot and cause an embolism."},
    {topic:"Maslow's Hierarchy", q:"A hospitalized patient is short of breath, anxious about missing work, and upset that family has not visited. Which need should the nurse address first?", options:["Oxygenation","Job security concerns","Family connection and belonging","Self-esteem"], correct:0, rationale:"Maslow's hierarchy places physiological needs — including oxygenation — at the base; these must be at least minimally met before security, social, or esteem needs can be addressed."},
    {topic:"Spiritual Care", q:"Which statement about spiritual care in person-centered nursing is accurate?", options:["It is optional and only relevant for patients who identify as religious","It is required by The Joint Commission and the National Consensus Project for Quality Palliative Care","It should be avoided unless the patient brings it up first, per HIPAA","It is the sole responsibility of the hospital chaplain, not the bedside nurse"], correct:1, rationale:"Spiritual care is mandated by The Joint Commission and the National Consensus Project for Quality Palliative Care — it's a standard of care, not an extra, and the bedside nurse plays a role in identifying and building it into the plan."},
    {topic:"Chronic Illness", q:"Which of the following is one of the seven tasks of chronic illness described by Corbin and Strauss?", options:["Curing the underlying disease","Preventing and managing crisis","Eliminating all medication use","Achieving complete symptom resolution"], correct:1, rationale:"The seven tasks of chronic illness include preventing/managing crisis, carrying out the regimen, controlling symptoms, reordering time, adjusting to disease changes, preventing social isolation, and normalizing interactions — chronic illness has no cure by definition."},
    {topic:"Frailty", q:"Which cluster of findings meets the criteria for frailty?", options:["Hypertension, hearing loss, and use of reading glasses","Unintentional weight loss, self-reported exhaustion, and slow walking speed","Age over 75 and living alone","Two chronic illnesses and one hospitalization in the past year"], correct:1, rationale:"Frailty is defined as 3 or more of: unintentional weight loss, self-reported exhaustion, weakness, slow walking speed, and low physical activity. Age, living situation, and diagnosis count alone don't define frailty."},
    {topic:"Elder Mistreatment", q:"Which statement about elder mistreatment (EM) is accurate?", options:["Most cases are promptly reported to authorities","Strangers commit the majority of domestic elder mistreatment","About 90% of domestic elder mistreatment is committed by family members","EM has little measurable effect on mortality risk"], correct:2, rationale:"Roughly 90% of domestic elder mistreatment is perpetrated by family members. EM is dramatically underreported (about five unreported cases for every one reported), and mortality risk roughly triples."},

    {topic:"Age-Friendly Care", q:"Which of the Age-Friendly \"4Ms\" specifically addresses preventing, identifying, and managing dementia, depression, and delirium?", options:["What Matters","Medication","Mentation","Mobility"], correct:2, rationale:"Mentation is the 4M focused on preventing, identifying, and managing dementia, depression, and delirium in older adults."}
